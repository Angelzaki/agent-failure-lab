[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-lab"
version = "0.1.0"
description = "Laboratorio de fallos agentic: tools, loops, cascadas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = ["pytest>=8.0.0", "rich>=13.7.0"]

[project.scripts]
agent-failure = "agent_failure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
